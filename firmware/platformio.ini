; Water Rower Monitor - Waveshare ESP32-S3-Touch-LCD-2.8
; SN: 132224 | Water Rower USA
; Display: ST7789 240x320 IPS (SPI) + CST328 capacitive touch (I2C)
; Audio:   onboard PCM5101 I2S DAC + amplifier + speaker header
[env:ws-s3-touch-lcd-28]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The board carries an ESP32-S3R8 module: 16 MB QIO flash + 8 MB OPI PSRAM.
; esp32-s3-devkitc-1 defaults to 8 MB/no-PSRAM, so both are set explicitly.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit BusIO@^1.14.5
    bblanchon/ArduinoJson@^6.21.3
    SPI
    Wire
    BLE

upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; USB-C goes straight to the S3 native USB (GPIO19/20) — there is no
    ; USB-UART bridge, so Serial has to ride on USB CDC to be reachable.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
